# Round D: artificial memory-poor operation of PLE-NVMe.
# Apply with the service stopped->started, remove afterwards.
# MemoryHigh caps usable page cache for the unit at ~20 GB (kernel reclaims
# PLE table pages under pressure); IOReadBandwidthMax throttles the backing
# NVMe so cold PLE reads are real disk latency, not cache luxury.
# NOTE: IOReadBandwidthMax needs the device node the filesystem lives on:
# /dev/nvme0n1 here. Weight loading (71 GB per boot) is slowed by the cap —
# expect a long boot (~15 min at 350 MB/s); that is part of the experiment,
# the steady-state matrix is measured after the boot finished.
[Service]
MemoryHigh=20G
IOReadBandwidthMax=/dev/nvme0n1 350M
